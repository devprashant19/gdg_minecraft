name: Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 06:00 UTC to prevent free Supabase project auto-pause
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production and Staging Status Endpoints
        env:
          PROD_URL: ${{ secrets.SITE_URL || 'https://crafthacks.dev' }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "Pinging production status..."
          curl -fsS -m 15 "$PROD_URL/api/status" || exit 1
          
          if [ -n "$STAGING_URL" ]; then
            echo "Pinging staging status..."
            curl -fsS -m 15 "$STAGING_URL/api/status" || true
          fi
          echo "Keep-alive ping completed successfully."

