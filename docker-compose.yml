version: '3.8'

services:
  # ─── 1. GATEWAY & REVERSE PROXY (NGINX) ──────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: nith_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    networks:
      - nith_network

  # ─── 2. NITH APPLICATION SERVER ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nith_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-nith_postgres_pass}@postgres:5432/hackathon
      - REDIS_URL=redis://:${REDIS_PASSWORD:-nith_redis_pass}@redis:6379
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://hackathon.nith.ac.in}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nith_network

  # ─── 3. IN-MEMORY CACHE (REDIS) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nith_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nith_redis_pass}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nith_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nith_network

  # ─── 4. AUTHORITATIVE DATABASE (POSTGRESQL) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nith_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nith_postgres_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nith_network

volumes:
  postgres_data:
  redis_data:
  nginx_cache:

networks:
  nith_network:
    driver: bridge
